    <script>
      /* Tentukan tema sebelum render supaya tidak berkedip: localStorage -> prefers-color-scheme */
      (function () {
        var t = "dark";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") t = saved;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) t = "light";
        } catch (e) {
          try {
            if (window.matchMedia("(prefers-color-scheme: light)").matches) t = "light";
          } catch (e2) {}
        }
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <style>
      /* Prevent flash of white before React loads */
      body {
        margin: 0;
        background: #030412;
      }
      html[data-theme="light"] body {
        background: #cfe8fb;
      }
      /* Sebelum React jalan, samakan dengan warna langit start screen siang */
      html[data-theme="light"] body.loading {
        background: #3b8fe6;
      }
      /* Prevent scrolling while loading */
      body.loading {
        overflow: hidden;
      }
    </style>
  </head>
  <body class="loading">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
